name: Update Global Hazard Feed

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "src/types/schema.ts"
      - ".github/workflows/ingest-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-feed
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Read the current data-feed archive
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/data-feed; then
            git fetch --depth=1 origin refs/heads/data-feed
            mkdir -p dist-data
            git show FETCH_HEAD:alerts.geojson > dist-data/alerts.geojson
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            echo 'Data-feed branch does not exist yet.'
          fi

      - name: Run ingestion and archive merger
        env:
          ARCHIVE_FROM_CHECKOUT: 'true'
          FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
          FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
          DECEA_API_KEY: ${{ secrets.DECEA_API_KEY }}
          DECEA_API_PASS: ${{ secrets.DECEA_API_PASS }}
          REPO_OWNER_AND_NAME: ${{ github.repository }}
        run: npx tsx scripts/ingest.ts

      - name: Publish GeoJSON to orphan data-feed branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-data
          publish_branch: data-feed
          force_orphan: true
